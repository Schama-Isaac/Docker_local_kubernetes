services:
  flask-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: msc-de1-flask-app:local
    container_name: msc-de1-flask-app
    restart: unless-stopped
    ports:
      - "5001:5000"
    environment:
      FLASK_ENV: production
      PORT: "5000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
